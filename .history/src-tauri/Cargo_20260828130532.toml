[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
image = "0.25.6"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-cli = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1    # Erlaubt dem Compiler maximale Optimierungen über das gesamte Projekt
lto = true           # Aktiviert Link-Time-Optimization (entfernt ungenutzten Code radikal)
opt-level = "s"      # Optimiert gezielt auf eine kleine Binärgröße (statt purer Geschwindigkeit)
panic = "abort"      # Entfernt teure Fehler-Rückverfolgungs-Systeme aus dem fertigen Paket
strip = true         # Schneidet alle Debug-Symbole und Variablennamen aus der fertigen Datei
